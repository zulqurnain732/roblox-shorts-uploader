name: 2.4 Hour Interval Roblox Uploader

on:
  schedule:
    # 24 ghante me 10 bar (har 2.4 ghante baad):
    - cron: '0 0 * * *'    # 00:00 UTC (05:00 AM PKT)
    - cron: '24 2 * * *'   # 02:24 UTC (07:24 AM PKT)
    - cron: '48 4 * * *'   # 04:48 UTC (09:48 AM PKT)
    - cron: '12 7 * * *'   # 07:12 UTC (12:12 PM PKT)
    - cron: '36 9 * * *'   # 09:36 UTC (02:36 PM PKT)
    - cron: '0 12 * * *'   # 12:00 UTC (05:00 PM PKT)
    - cron: '24 14 * * *'  # 14:24 UTC (07:24 PM PKT)
    - cron: '48 16 * * *'  # 16:48 UTC (09:48 PM PKT)
    - cron: '12 19 * * *'  # 19:12 UTC (12:12 AM PKT)
    - cron: '36 21 * * *'  # 21:36 UTC (02:36 AM PKT)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install google-api-python-client google-auth-oauthlib requests gdown

      - name: Run Uploader Script
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          python uploader.py

      - name: Commit Tracker File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add uploaded.json
          git commit -m "Update uploaded.json after single upload" || exit 0
          git push
          
