name: 2.4 Hour Interval Roblox Uploader

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '24 2 * * *'
    - cron: '48 4 * * *'
    - cron: '12 7 * * *'
    - cron: '36 9 * * *'
    - cron: '0 12 * * *'
    - cron: '24 14 * * *'
    - cron: '48 16 * * *'
    - cron: '12 19 * * *'
    - cron: '36 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install google-api-python-client google-auth-oauthlib requests

      - name: Run Uploader Script
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
        run: |
          python uploader.py

      - name: Commit Tracker File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f uploaded.json ]; then
            git add uploaded.json
            git commit -m "Update uploaded.json after single upload" || echo "No changes to commit"
            git push
          else
            echo "uploaded.json not found, skipping commit."
          fi
